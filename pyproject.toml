[project]
name = "cng-vector-formats"
version = "0.1.0"
description = "Exploring Cloud-Native Geospatial Formats: A Hands-on Workshop for Vector Data"
readme = "README.md"
authors = [
    { name = "Jarrett Keifer", email = "jkeifer0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.1",
    "devtools>=0.12.2",
    "hctef[async]>=0.4.1",
    "ipython>=9.16.1",
    "jupyterlab>=4.4.6",
    "por-que>=0.5.0",
    "shapely>=2.1.1",
]

[project.urls]
Repository = 'https://github.com/jkeifer/cng-vector-formats'

[tool.uv]
package = false

[tool.workshopify]
# The context module: its module-level names are the namespace the cog
# generators in src/ run in, and its ASSETS map declares binary files
# derived from the recorded params (placed on render/set, verified by check).
context = "scripts/workshop_context.py"

[tool.workshopify.render]
# The sources carry cog generators in comments; their location-dependent
# values are rendered inline.
files = ["src/*.py"]

[tool.workshopify.build]
# Repo files that ship to participants unchanged. Files that differ from
# main's live in static/ instead; nothing appears in both places.
include = [
    "Dockerfile",
    "compose.yml",
    ".devcontainer",
    # Ships verbatim so the published branch runs its own CI. The file is
    # branch-agnostic by design: push/PR fire it here, and the monthly cron
    # and manual dispatch fire it on main (a schedule only ever runs the
    # default branch's copy), where it checks out `workshop` explicitly.
    ".github/workflows/workshop.yml",
]
# notebook-assets is deliberately absent: its one file is the screenshot the
# context's ASSETS map owns, and an asset already publishes itself. Listing it
# here too would give one published path two sources, which build rejects.

[tool.workshopify.params]
# The location the src/ files currently contain. Change it with
# `uv run workshopify set location <slug>`, never by hand.
location = "hiroshima"

[dependency-groups]
dev = [
    "cogapp>=3.5.1",
    "ipynb-scrubber>=0.5.0",
    "jupytext>=1.19.4",
    "nbclient>=0.11.0",
    "prek>=0.4.8",
    "pytest>=8.4.2",
    "ruff>=0.16.2",
    "workshopify>=0.2.2",
]

[tool.ruff]
# `display` is an IPython builtin available in every notebook cell.
builtins = ["display", "params"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# The notebook sources deliberately import modules mid-file, where the
# narrative introduces them (E402), and use top-level await, which is valid in
# the IPython kernel's event loop (F704/PLE1142 -- both rules flag it). They
# also end cells with a bare expression or a bare comparison, which is how a
# notebook displays a value or a check's result, not a mistake (B018, B015).
"src/*.py" = ["E402", "F704", "PLE1142", "B018", "B015"]

[tool.ruff.lint.isort]
lines-between-types = 1
# The notebooks alias imports for narrative clarity (`from_wkb as
# shapely_from_wkb`). Without this, isort explodes each alias into its own
# `from shapely import (...)` statement.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
# The py:percent files in src/ are the source of truth, named for their
# exercises (e.g. src/01_is-geojson-cloud-native.py). `workshopify generate`
# renders each one into a completed notebook in notebooks-completed/, which it
# then scrubs into the exercise notebook in notebooks/. The .py files give
# clean, reviewable diffs in version control; every notebook is generated, and
# none of them is committed.
#
# Workflow:
#   1. Edit src/NN_<name>.py.
#   2. `uv run workshopify generate` to regenerate the notebooks + notes.
#
# There is deliberately no `formats` pairing here, and adding one back would
# destroy source. Generation strips the embedded cog templating before handing
# the text to jupytext, so a completed notebook is not a round-trip of its .py
# -- it is missing every `[[[cog ...]]]` block. Pair the two directories and
# jupytext resolves that difference in favour of whichever file is newer, which
# after a generate is always the notebook: `jupytext --sync src/*.py` then
# rewrites each .py with the stripped text, silently deleting its generators.
# Notebooks are one-way build artifacts; edit the .py and regenerate.
#
# The settings below still apply: workshopify loads this config explicitly and
# hands it to the jupytext API calls that read the .py and write the .ipynb.
#
# Keep outputs out of the .py (they live only in the .ipynb). Cell tags are
# kept so cells that intentionally raise can carry the "raises-exception" tag
# nbclient/`jupyter execute` needs to continue past them.
notebook_metadata_filter = "-all"
cell_metadata_filter = "tags,-all"

[tool.ipynb-scrubber.options]
clear-text = ""

[[tool.ipynb-scrubber.files]]
input = "notebooks-completed/01_is-geojson-cloud-native.ipynb"
output = "notebooks/01_is-geojson-cloud-native.ipynb"
notes-file = "notes/01_is-geojson-cloud-native.md"

[[tool.ipynb-scrubber.files]]
input = "notebooks-completed/02_the-well-knowns.ipynb"
output = "notebooks/02_the-well-knowns.ipynb"
notes-file = "notes/02_the-well-knowns.md"

[[tool.ipynb-scrubber.files]]
input = "notebooks-completed/03_reading-parquet-the-hard-way.ipynb"
output = "notebooks/03_reading-parquet-the-hard-way.ipynb"
notes-file = "notes/03_reading-parquet-the-hard-way.md"
