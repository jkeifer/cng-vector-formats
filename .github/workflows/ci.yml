name: CI

# Guards `main`. The published `workshop` branch has its own workflow
# (workshop.yml), which ships to it via [tool.workshopify.build] include.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      # The hooks include `workshopify check`, which is why there is no
      # separate step for it here. The asset half of that check needs the
      # staged screenshot, which a bare checkout does not have (it is build
      # output, generated by `workshopify render`, never committed), so skip
      # it. The rendered values in src/ -- the part that *is* committed, and
      # the part CI exists to guard -- are still verified.
      - name: Run prek hooks
        env:
          WORKSHOPIFY_SKIP_ASSETS: 'true'
        run: uv run prek run --all-files
      - name: Run tests
        run: uv run pytest --ignore=tests/test_notebook_links.py

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Notebook 03 reads Overture parquet over HTTP through hctef, which
      # persists every fetched byte range here. Restoring the cache lets
      # reruns skip most of the network I/O; the key is unique per run so
      # the post step always saves the (possibly updated) cache, and
      # restore-keys picks up the most recent prior run's cache.
      HCTEF_CACHE_DIR: ${{ github.workspace }}/.hctef-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Restore hctef byte cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hctef-cache
          key: hctef-cache-${{ github.run_id }}
          restore-keys: |
            hctef-cache-
      - name: Install dependencies
        run: uv sync
      # Assets are build output, so place them before generating: exercise 1
      # embeds the screenshot, and the link test below checks it resolves.
      - name: Render templated values and assets
        run: uv run workshopify render
      - name: Generate notebooks
        run: uv run workshopify generate
      # Needs the generated tree, so it cannot run in the lint job. Executing
      # a notebook never touches a markdown image path, so without this the
      # exercise and completed notebooks can point at an asset that does not
      # resolve and still go green.
      - name: Check notebook links resolve
        run: uv run pytest tests/test_notebook_links.py
      - name: Execute notebook 01
        run: uv run jupyter execute notebooks-completed/01_is-geojson-cloud-native.ipynb
      - name: Execute notebook 02
        run: uv run jupyter execute notebooks-completed/02_the-well-knowns.ipynb
      - name: Execute notebook 03
        run: uv run jupyter execute notebooks-completed/03_reading-parquet-the-hard-way.ipynb

  build:
    # A smoke test only: proves the published tree still assembles, so a
    # broken build surfaces on the PR that breaks it rather than the evening
    # before a workshop. Nothing is committed or pushed -- publishing stays a
    # deliberate, reviewed act.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build assembles into a worktree of the workshop branch, so that
          # branch has to be present locally.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Assemble the published tree
        run: uv run workshopify build --clean
      # The asset is no longer committed on main, so this run proves build
      # stages it from its ASSETS source in locations/ rather than copying a
      # working-tree file that happened to be lying around.
      - name: Verify the screenshot was published
        run: test -f workshop/notebook-assets/geojson_io.png
      - name: Show what would be published
        run: git -C workshop status --short
